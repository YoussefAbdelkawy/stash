<title>Stash Look Prototypes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: chooser, then one 390px phone. Two looks share markup; .studio / .glass set the tokens. */
:root{
  --page:#e9ecf1; --chooser:#ffffff; --chooser-ink:#111827; --chooser-muted:#5b6472; --chooser-line:#d6dbe3; --chooser-accent:#2b4acb;
  --video:#e5484d; --course:#0b84e5; --cert:#8e4ec6; --book:#d9822b; --project:#12a594;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#07080c;--chooser:#151821;--chooser-ink:#eef1f6;--chooser-muted:#9aa3b2;--chooser-line:#2a2f3b;--chooser-accent:#8ea2ff;color-scheme:dark}}
:root[data-theme="dark"]{--page:#07080c;--chooser:#151821;--chooser-ink:#eef1f6;--chooser-muted:#9aa3b2;--chooser-line:#2a2f3b;--chooser-accent:#8ea2ff;color-scheme:dark}

/* A · Studio: cool paper, ink-navy hero, cover tiles, Bricolage display */
.studio{--bg:#f3f5f8;--surface:#ffffff;--ink:#0e1a2b;--muted:#5d6878;--line:#e3e7ed;--accent:#2b4acb;--on-accent:#ffffff;
  --hero:linear-gradient(140deg,#13213a 0%,#1d3a7a 100%);--hero-ink:#ffffff;--hero-muted:#b7c3dd;--chip:#eef1f6;
  --shadow:0 1px 2px rgb(14 26 43/.06),0 8px 24px rgb(14 26 43/.08);--display:"Bricolage Grotesque",system-ui,sans-serif;--radius:18px;
  --warn-bg:#fff2dc;--warn-fg:#8a4b00;--done:#15803d;--nav:#ffffffee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .studio{--bg:#0d121b;--surface:#151c28;--ink:#e9eef6;--muted:#9aa6b8;--line:#232c3b;--accent:#8ea2ff;--on-accent:#0d121b;
  --hero:linear-gradient(140deg,#1a2a4f 0%,#2a47a0 100%);--chip:#1c2433;--shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.35);--warn-bg:#3a2a0c;--warn-fg:#ffcf7a;--done:#4ade80;--nav:#151c28ee}}
:root[data-theme="dark"] .studio{--bg:#0d121b;--surface:#151c28;--ink:#e9eef6;--muted:#9aa6b8;--line:#232c3b;--accent:#8ea2ff;--on-accent:#0d121b;
  --hero:linear-gradient(140deg,#1a2a4f 0%,#2a47a0 100%);--chip:#1c2433;--shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.35);--warn-bg:#3a2a0c;--warn-fg:#ffcf7a;--done:#4ade80;--nav:#151c28ee}

/* B · Glow: dark-first, frosted hero over section-colored light, grouped inset list, Sora display */
.glow{--bg:#0f0d1a;--surface:#1a1729;--ink:#f1eefb;--muted:#a49fbd;--line:#2b2740;--accent:#b4a6ff;--on-accent:#120f20;
  --hero:linear-gradient(160deg,rgb(255 255 255/.14),rgb(255 255 255/.04));--hero-ink:#ffffff;--hero-muted:#cfc8ea;--chip:#242036;
  --shadow:0 10px 30px rgb(0 0 0/.35);--display:"Sora",system-ui,sans-serif;--radius:22px;--warn-bg:#3d2c10;--warn-fg:#ffd28a;--done:#5ee39a;--nav:#161324e6;
  --glow1:#6d4cff55;--glow2:#e5484d33;--glow3:#12a59433}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .glow{--bg:#f4f2fb;--surface:#ffffff;--ink:#17132a;--muted:#5f5a78;--line:#e4e0f2;--accent:#5b3fe0;--on-accent:#ffffff;
  --hero:linear-gradient(160deg,rgb(255 255 255/.75),rgb(255 255 255/.45));--hero-ink:#17132a;--hero-muted:#5f5a78;--chip:#ece9f8;--shadow:0 10px 30px rgb(40 20 120/.12);
  --warn-bg:#fff2dc;--warn-fg:#8a4b00;--done:#15803d;--nav:#ffffffeb;--glow1:#6d4cff40;--glow2:#e5484d26;--glow3:#12a59426}}
:root[data-theme="light"] .glow{--bg:#f4f2fb;--surface:#ffffff;--ink:#17132a;--muted:#5f5a78;--line:#e4e0f2;--accent:#5b3fe0;--on-accent:#ffffff;
  --hero:linear-gradient(160deg,rgb(255 255 255/.75),rgb(255 255 255/.45));--hero-ink:#17132a;--hero-muted:#5f5a78;--chip:#ece9f8;--shadow:0 10px 30px rgb(40 20 120/.12);
  --warn-bg:#fff2dc;--warn-fg:#8a4b00;--done:#15803d;--nav:#ffffffeb;--glow1:#6d4cff40;--glow2:#e5484d26;--glow3:#12a59426}

*{box-sizing:border-box}
body{background:var(--page);color:var(--chooser-ink);font-family:"Inter",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent,var(--chooser-accent));outline-offset:2px}
.top{max-width:430px;margin:0 auto 14px;display:grid;gap:10px}
.top h1{font-size:20px;margin:0}
.top p{margin:0;color:var(--chooser-muted);line-height:1.5;font-size:14px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:2px solid var(--chooser-line);background:var(--chooser);border-radius:12px;padding:10px;text-align:left}
.pick button[aria-pressed="true"]{border-color:var(--chooser-accent)}
.pick b{display:block}
.pick span{font-size:12px;color:var(--chooser-muted)}
.note{max-width:430px;margin:12px auto 0;text-align:center;font-size:12px;color:var(--chooser-muted)}

.phone{max-width:390px;height:800px;margin:0 auto;border-radius:32px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line),0 30px 60px rgb(0 0 0/.18);isolation:isolate}
.glow::before{content:"";position:absolute;inset:-20% -30% auto;height:420px;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 50% at 25% 40%,var(--glow1),transparent 70%),radial-gradient(35% 45% at 80% 30%,var(--glow2),transparent 70%),radial-gradient(40% 40% at 60% 75%,var(--glow3),transparent 70%)}
.scroll{flex:1;overflow-y:auto;padding:20px 18px 150px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex-shrink:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.head{display:flex;justify-content:space-between;align-items:center}
.date{font-size:13px;color:var(--muted);margin:0 0 2px;font-weight:500}
.hello{font-family:var(--display);font-weight:800;font-size:30px;margin:0;line-height:1.05;letter-spacing:-.02em}
.glow .hello{font-weight:700;letter-spacing:-.03em}
.hello span{display:inline-block}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--muted)}
.glow .search{background:var(--chip);border-color:transparent}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.glow .stat{background:var(--chip);border-color:transparent}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.now{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--hero);color:var(--hero-ink);padding:16px;display:grid;grid-template-columns:84px 1fr;gap:14px;box-shadow:var(--shadow)}
.glow .now{border:1px solid rgb(255 255 255/.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.now .cover{width:84px;height:84px;border-radius:14px}
.now .label{font-size:12px;color:var(--hero-muted);font-weight:600;display:flex;align-items:center;gap:6px}
.now .label i{width:7px;height:7px;border-radius:50%;background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 30%,transparent)}
.now h2{font-family:var(--display);font-size:19px;line-height:1.2;margin:4px 0 0;letter-spacing:-.01em}
.now .foot{grid-column:1/-1;display:grid;gap:10px}
.bar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--hero-ink) 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hero-ink);transform-origin:left;transform:scaleX(var(--p,0));border-radius:9px}
.nowrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--hero-muted)}
.done-btn{display:flex;align-items:center;gap:6px;border:0;background:var(--hero-ink);color:#13213a;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
.glow .done-btn{background:var(--accent);color:var(--on-accent)}
.sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgb(255 255 255/.25) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}

.cover{display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000) 100%)}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 30% 20%,rgb(255 255 255/.35),transparent 70%)}
.cover svg{width:26px;height:26px;position:relative;z-index:1}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);position:relative;background:var(--chip);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;padding:9px;font-weight:600;font-size:14px;color:var(--muted);position:relative;z-index:1;border-radius:10px}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0/.12);transition:transform 200ms cubic-bezier(.16,1,.3,1)}
.glow .tabs{background:none;padding:0;border-bottom:1px solid var(--line);border-radius:0}
.glow .tabs .pill{top:auto;bottom:-1px;left:0;height:2px;width:calc(100%/3);background:var(--accent);box-shadow:none;border-radius:2px}
.n{display:inline-block;margin-left:5px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

.list{display:grid;gap:10px}
.glow .list{gap:0;background:var(--surface);border-radius:var(--radius);padding:4px 12px;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;box-shadow:0 1px 2px rgb(0 0 0/.04)}
.glow .row{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:12px 0}
.glow .row:last-child{border-bottom:0}
.row .cover{width:52px;height:52px;border-radius:12px}
.row .cover svg{width:22px;height:22px}
.row strong{display:block;font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.row small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chev{color:var(--muted)}
.badge{background:var(--warn-bg);color:var(--warn-fg);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.dice .cover{--c:var(--accent)}
.reel{height:20px;overflow:hidden}
#reel,#reel span{display:block}
#reel span{height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:26px 12px;line-height:1.5;margin:0;display:grid;gap:10px;justify-items:center}
.empty .cover{--c:var(--accent);width:56px;height:56px;border-radius:16px}

.dock{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:8px 4px;box-shadow:var(--shadow)}
.dock button{border:0;background:none;font-size:10.5px;color:var(--muted);display:grid;gap:3px;justify-items:center;padding:4px 0;font-weight:500}
.dock button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.dock button[aria-pressed="true"] svg{color:var(--c,var(--accent))}
.plus{position:absolute;right:20px;bottom:92px;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.plus svg{width:26px;height:26px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:13px;z-index:5;box-shadow:var(--shadow)}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
.stamp b{font-family:var(--display);font-weight:800;font-size:44px;color:var(--done);border:4px solid var(--done);border-radius:14px;padding:4px 18px;background:var(--bg)}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:6}
@supports (animation-timeline: scroll()){.now{animation:shrink linear both;animation-timeline:scroll(nearest);animation-range:0 240px}@keyframes shrink{to{transform:scale(.93) translateY(-8px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="top">
  <h1>Stash: pick a look</h1>
  <p>Same Focus layout and the same Cinematic motion, two finishes. Tap rows, Mark done, Random pick in To do, the bottom bar, and search.</p>
  <div class="pick" role="group" aria-label="Choose look">
    <button id="pA" aria-pressed="true"><b>A · Studio</b><span>Crisp light pages, ink-blue hero card, cover tiles on cards</span></button>
    <button id="pB" aria-pressed="false"><b>B · Glow</b><span>Dark and rich, frosted hero card over soft color light, grouped list</span></button>
  </div>
</div>
<div class="phone studio" id="phone"></div>
<p class="note">Example items. Real YouTube thumbnails will fill the video covers. Both looks have a light and a dark version.</p>

<script>
const ICON={
 all:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
 video:'<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.5 9.2l4.6 2.8-4.6 2.8z" fill="currentColor"/>',
 course:'<path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/><path d="M6.5 11.5v4.3c3.2 2.3 7.8 2.3 11 0v-4.3"/>',
 cert:'<circle cx="12" cy="9" r="5.5"/><path d="M8.8 13.6L7.5 21l4.5-2.6 4.5 2.6-1.3-7.4"/>',
 book:'<path d="M5 4.5A1.5 1.5 0 016.5 3H19v15H6.5A1.5 1.5 0 005 19.5z"/><path d="M5 19.5A1.5 1.5 0 006.5 21H19"/>',
 project:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>', plus:'<path d="M12 5v14M5 12h14"/>',
 dice:'<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', save:'<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/>', chev:'<path d="M9.5 6l6 6-6 6"/>'};
const svg=(k,c="i")=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const SEC={all:"All",video:"Videos",course:"Courses",cert:"Certs",book:"Books",project:"Projects"};
const ONE={video:"Video",course:"Course",cert:"Certificate",book:"Book",project:"Project"};
const LABEL={todo:"To do",doing:"Doing",done:"Done"},NEXT={todo:"doing",doing:"done",done:"todo"};
const START=[
 {id:1,s:"project",t:"Build a budget tracker in React",st:"doing",check:[3,7],src:"Size M, Mid"},
 {id:2,s:"video",t:"Supabase in 100 seconds",st:"doing",src:"Fireship, 2:41"},
 {id:3,s:"cert",t:"Google Data Analytics Certificate",st:"todo",src:"Coursera, paid"},
 {id:4,s:"book",t:"Atomic Habits",st:"todo",src:"James Clear"},
 {id:5,s:"course",t:"The Odin Project: Full Stack JavaScript",st:"todo",src:"theodinproject.com"},
 {id:6,s:"video",t:"youtu.be/abc123",st:"todo",draft:true,src:"Saved from Share"},
 {id:7,s:"book",t:"Deep Work",st:"todo",src:"Cal Newport"},
 {id:8,s:"project",t:"Portfolio website",st:"todo",draft:true,src:"No checklist yet"},
 {id:9,s:"course",t:"CS50x Introduction to Computer Science",st:"done",src:"edx.org"}];
let items,look="studio",tab="doing",filter="all",query="",busy=false;
const phone=document.getElementById("phone"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const anim=(el,k,o)=>still||!el?{finished:Promise.resolve()}:el.animate(k,o);
const EO="cubic-bezier(.16,1,.3,1)",EI="cubic-bezier(.7,0,.84,0)";
const shown=()=>items.filter(i=>(filter==="all"||i.s===filter)&&(!query||i.t.toLowerCase().includes(query)));
const cover=(s,cls="cover")=>`<span class="${cls}" style="--c:var(--${s})">${svg(s)}</span>`;

function render(){
  const list=shown(),now=list.find(i=>i.st==="doing"),rows=list.filter(i=>i.st===tab&&i!==now),count=s=>list.filter(i=>i.st===s).length;
  const today=new Date().toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long"});
  phone.className="phone "+look;
  phone.innerHTML=`<div class="scroll">
   <div class="head"><div><p class="date">${today}</p><h1 class="hello"><span>Keep</span> <span>going</span></h1></div>
     <button class="iconbtn" data-act="backup" aria-label="Download backup">${svg("save")}</button></div>
   <label class="search">${svg("search")}<input id="q" type="search" placeholder="Search videos, books, courses…" aria-label="Search" value="${esc(query)}"></label>
   ${now?`<section class="now" aria-label="Now"><div class="sweep"></div>${cover(now.s)}
     <div><span class="label"><i></i>Now, ${ONE[now.s]}</span><h2>${esc(now.t)}</h2></div>
     <div class="foot">${now.check?`<div class="bar" aria-label="${now.check[0]} of ${now.check[1]} steps done"><i style="--p:${now.check[0]/now.check[1]}"></i></div>`:""}
     <div class="nowrow"><span>${now.check?`${now.check[0]} of ${now.check[1]} steps done`:esc(now.src)}</span><button class="done-btn" data-done="${now.id}">${svg("check")}Mark done</button></div></div></section>`:""}
   <div class="tabs" role="group" aria-label="Status"><span class="pill" style="transform:translateX(${["doing","todo","done"].indexOf(tab)*100}%)"></span>
     ${["doing","todo","done"].map(s=>`<button data-tab="${s}" aria-pressed="${tab===s}">${LABEL[s]}<span class="n">${count(s)}</span></button>`).join("")}</div>
   <div class="list" id="list">
    ${tab==="todo"&&rows.length?`<button class="row dice" data-act="rand"><span class="cover">${svg("dice")}</span><span><strong class="reel"><span id="reel"><span>Random pick</span></span></strong><small>Can't choose? Let Stash pick one.</small></span>${svg("chev","i chev")}</button>`:""}
    ${rows.map(i=>`<button class="row" data-id="${i.id}" aria-label="${esc(i.t)}. Tap to move to ${LABEL[NEXT[i.st]]}">${cover(i.s)}
      <span><strong>${esc(i.t)}</strong><small><span class="dot" style="--c:var(--${i.s})"></span>${ONE[i.s]}, ${esc(i.src)}</small></span>
      ${i.draft?'<span class="badge">Needs details</span>':svg("chev","i chev")}</button>`).join("")}
    ${!rows.length?`<div class="empty"><span class="cover">${svg(tab==="done"?"check":"all")}</span><span>${tab==="done"?"Nothing finished yet. Your wins will collect here.":`Nothing in ${LABEL[tab]}${filter!=="all"?" for "+SEC[filter]:""}. Tap an item in another tab to move it here.`}</span></div>`:""}
   </div></div>
   <button class="plus" data-act="add" aria-label="Save a link">${svg("plus")}</button>
   <nav class="dock" aria-label="Sections">${Object.keys(SEC).map(k=>`<button data-f="${k}" aria-pressed="${filter===k}" style="--c:var(--${k==="all"?"accent":k})">${svg(k)}${SEC[k]}</button>`).join("")}</nav>`;
}
function opening(){render();
  phone.querySelectorAll(".hello span").forEach((w,n)=>anim(w,[{opacity:0,transform:"translateY(70%)"},{opacity:1,transform:"none"}],{duration:600,delay:n*120,easing:EO,fill:"backwards"}));
  phone.querySelectorAll(".date,.search,.tabs,.iconbtn").forEach(e=>anim(e,[{opacity:0},{opacity:1}],{duration:400,delay:350,fill:"backwards"}));
  const now=phone.querySelector(".now");
  if(now){anim(now,[{opacity:0,transform:"translateY(40px) scale(.94)"},{opacity:1,transform:"none"}],{duration:700,delay:250,easing:EO,fill:"backwards"});
    anim(now.querySelector(".sweep"),[{transform:"translateX(-120%)"},{transform:"translateX(120%)"}],{duration:900,delay:800,easing:"ease-in-out"});
    anim(now.querySelector(".cover"),[{transform:"scale(.6) rotate(-8deg)",opacity:0},{transform:"none",opacity:1}],{duration:600,delay:500,easing:EO,fill:"backwards"});}
  phone.querySelectorAll("#list .row").forEach((r,n)=>anim(r,[{opacity:0,transform:"translateY(24px)"},{opacity:1,transform:"none"}],{duration:500,delay:650+n*70,easing:EO,fill:"backwards"}));
  anim(phone.querySelector(".dock"),[{opacity:0,transform:"translateY(30px)"},{opacity:1,transform:"none"}],{duration:600,delay:700,easing:EO,fill:"backwards"});
  anim(phone.querySelector(".plus"),[{opacity:0,transform:"scale(.4) rotate(-90deg)"},{opacity:1,transform:"none"}],{duration:500,delay:950,easing:EO,fill:"backwards"});}
function toast(m){phone.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.role="status";t.textContent=m;phone.append(t);
  anim(t,[{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:200,easing:EO});
  setTimeout(()=>anim(t,[{opacity:1},{opacity:0}],{duration:150,easing:EI}).finished.then(()=>t.remove()),2400)}
async function move(id){const i=items.find(x=>x.id==id),row=phone.querySelector(`[data-id="${id}"]`),tg=phone.querySelector(`[data-tab="${NEXT[i.st]}"]`),a=row.getBoundingClientRect(),b=tg.getBoundingClientRect();
  await anim(row,[{transform:"none",opacity:1},{transform:`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top-a.top}px) scale(.2)`,opacity:0}],{duration:450,easing:EI,fill:"forwards"}).finished;
  i.st=NEXT[i.st];render();anim(phone.querySelector(`[data-tab="${i.st}"] .n`),[{transform:"scale(1.8)"},{transform:"none"}],{duration:400,easing:EO});toast(`Moved to ${LABEL[i.st]}: ${i.t}`)}
async function markDone(id){const i=items.find(x=>x.id==id),card=phone.querySelector(".now");
  if(!still){const s=document.createElement("div");s.className="stamp";s.innerHTML="<b>Done</b>";phone.append(s);
    await anim(s.firstChild,[{opacity:0,transform:"scale(2.4) rotate(-14deg)"},{opacity:1,transform:"scale(1) rotate(-8deg)"}],{duration:280,easing:EI,fill:"forwards"}).finished;
    const r=s.firstChild.getBoundingClientRect(),p=phone.getBoundingClientRect();
    for(let n=0;n<18;n++){const d=document.createElement("i");d.className="spark";d.style.cssText=`left:${r.left-p.left+r.width/2}px;top:${r.top-p.top+r.height/2}px;background:var(--${["video","course","cert","book","project","done"][n%6]})`;phone.append(d);
      const g=n/18*Math.PI*2,dist=90+Math.random()*60;anim(d,[{transform:"none",opacity:1},{transform:`translate(${Math.cos(g)*dist}px,${Math.sin(g)*dist}px) rotate(${n*40}deg)`,opacity:0}],{duration:700,easing:EO}).finished.then(()=>d.remove())}
    await anim(card,[{transform:"none",opacity:1},{transform:"translateY(-30px) rotateX(35deg) scale(.9)",opacity:0}],{duration:450,delay:250,easing:EI,fill:"forwards"}).finished;
    anim(s,[{opacity:1},{opacity:0}],{duration:300}).finished.then(()=>s.remove());}
  i.st="done";render();anim(phone.querySelector(".now"),[{opacity:0,transform:"translateY(40px) scale(.94)"},{opacity:1,transform:"none"}],{duration:600,easing:EO});toast(`Done: ${i.t}`)}
async function randomPick(){const pool=shown().filter(i=>i.st==="todo"),pick=pool[Math.floor(Math.random()*pool.length)],reel=phone.querySelector("#reel");
  if(!still){const spins=[...Array(14)].map((_,n)=>pool[n%pool.length].t).concat(pick.t);reel.innerHTML=spins.map(t=>`<span>${esc(t)}</span>`).join("");
    const a=reel.animate([{transform:"none"},{transform:`translateY(-${(spins.length-1)*20}px)`}],{duration:1600,easing:"cubic-bezier(.12,.8,.2,1)",fill:"forwards"});await a.finished;
    setTimeout(()=>{a.cancel();reel.innerHTML="<span>Random pick</span>"},1800)}
  const row=phone.querySelector(`[data-id="${pick.id}"]`);row.scrollIntoView({block:"center",behavior:still?"auto":"smooth"});
  anim(row,[{transform:"scale(1)",boxShadow:"0 0 0 0 transparent"},{transform:"scale(1.03)",boxShadow:"0 0 0 3px var(--accent)"},{transform:"scale(1)",boxShadow:"0 0 0 0 transparent"}],{duration:1100,easing:"ease-out"});toast(`Random pick: ${pick.t}`)}
function switchTab(t){if(t===tab)return;tab=t;render();phone.querySelectorAll("#list .row").forEach((r,n)=>anim(r,[{opacity:0,transform:"translateX(30px)"},{opacity:1,transform:"none"}],{duration:400,delay:n*40,easing:EO,fill:"backwards"}))}
phone.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||busy)return;busy=true;
  try{if(b.dataset.tab)switchTab(b.dataset.tab);else if(b.dataset.f){filter=b.dataset.f;render();phone.querySelectorAll("#list .row").forEach((r,n)=>anim(r,[{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:350,delay:n*40,easing:EO,fill:"backwards"}))}
  else if(b.dataset.id)await move(b.dataset.id);else if(b.dataset.done)await markDone(b.dataset.done);else if(b.dataset.act==="rand")await randomPick();
  else if(b.dataset.act==="backup")toast("Backup saved to your Downloads.");else if(b.dataset.act==="add")toast("Paste a link here, or use Share in YouTube or Chrome.")}finally{busy=false}});
phone.addEventListener("input",e=>{if(e.target.id!=="q")return;query=e.target.value.toLowerCase();render();const q=document.getElementById("q");q.focus();q.setSelectionRange(q.value.length,q.value.length)});
function choose(l){look=l;items=JSON.parse(JSON.stringify(START));tab="doing";filter="all";query="";pA.setAttribute("aria-pressed",l==="studio");pB.setAttribute("aria-pressed",l==="glow");opening()}
pA.onclick=()=>choose("studio");pB.onclick=()=>choose("glow");choose("studio");
</script>
